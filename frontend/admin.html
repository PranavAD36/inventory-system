<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel — Inventory Management System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ============================================
       HEADER with role badge and logout
    ============================================= -->
    <header>
      <div class="header-row">
        <div>
          <h1>Inventory Management System</h1>
          <p>Admin Panel &mdash; Manage Products</p>
        </div>
        <div class="header-actions">
          <span class="role-badge role-admin">Admin</span>
          <button class="btn btn-outline btn-sm btn-logout" onclick="logout()">
            Logout
          </button>
        </div>
      </div>
    </header>

    <!-- Status message banner -->
    <div id="status-msg" class="status-msg hidden"></div>

    <main class="page-content">
      <!-- ============================================
           SECTION A: Add Product (CREATE)
      ============================================= -->
      <div class="card">
        <h2>Add Product</h2>
        <form id="form-add-product">
          <label>Product Name *</label>
          <input type="text" id="prod-name" title="Product Name" required />

          <label>Price (₹) *</label>
          <input
            type="number"
            id="prod-price"
            title="Price"
            min="1"
            step="0.01"
            required
          />

          <label>Stock *</label>
          <input
            type="number"
            id="prod-stock"
            title="Stock"
            min="0"
            value="0"
            required
          />

          <button
            type="submit"
            class="btn btn-primary"
            id="btn-add-product"
            disabled
          >
            Add Product
          </button>
        </form>
      </div>

      <!-- ============================================
           SECTION B: Manage Products (READ + UPDATE + DELETE)
      ============================================= -->
      <div class="card">
        <h2>Manage Products</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Price (₹)</th>
                <th>Stock</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tbody-products">
              <tr>
                <td colspan="5" class="loading">Loading products...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="admin.js"></script>
  </body>
</html>
