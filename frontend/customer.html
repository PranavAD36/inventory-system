<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop - Inventory Management System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-row">
        <div>
          <h1>Inventory Management System</h1>
          <p>Customer View - Browse Products</p>
        </div>
        <div class="header-actions">
          <span class="role-badge role-customer">Customer</span>
          <button class="btn btn-outline btn-sm btn-logout" onclick="logout()">
            Logout
          </button>
        </div>
      </div>
    </header>

    <div id="status-msg" class="status-msg hidden"></div>

    <main class="page-content">
      <div class="card">
        <h2>Available Products</h2>
        <table>
          <thead>
            <tr>
              <th>Product Name</th>
              <th>Price</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tbody-products">
            <tr>
              <td colspan="4" class="loading">Loading products...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <script src="customer.js"></script>
  </body>
</html>
